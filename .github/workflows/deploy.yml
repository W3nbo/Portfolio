name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main  # 监听 main 分支的推送，如果是 master 分支请修改这里

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Deploy Hook
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/pages/webhooks/deploy_hooks/4f3a2cdc-a334-4f24-b8af-2a730c0f0a6e"
